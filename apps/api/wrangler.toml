name = "ga-settle-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"] # vitest-pool-workers 요건 + node: 빌트인 대비

# 리소스 생성 완료 (2026-07-07, account: 생각과 행동)
[[d1_databases]]
binding = "DB"
database_name = "ga-settle-db"
database_id = "6f2e9c25-466e-42ee-b810-2587fd3101eb"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "ga-settle-uploads"

[[queues.producers]]
binding = "PARSE_QUEUE"
queue = "ga-settle-parse"

[[queues.consumers]]
queue = "ga-settle-parse"
max_retries = 3

[vars]
ENV = "dev"
# 시크릿은 .dev.vars / wrangler secret put:
#   ANTHROPIC_API_KEY, FIELD_ENCRYPTION_KEY, SESSION_SECRET, ADMIN_IP_ALLOWLIST

# 정적 자산(SPA) - apps/web/dist를 같은 오리진에서 서빙 (B-006 단일 오리진).
# binding=ASSETS로 Worker가 SPA 폴백(index.html) 직접 서빙. 매칭 파일은 assets 레이어가 우선 서빙.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

# ─────────────────────────────────────────────────────────────
# 프로덕션 환경 (배포: wrangler deploy --env production)
# 커스텀 도메인 ata.minu.best (minu.best 가 이 CF 계정의 zone이어야 자동 DNS/cert 발급).
# env-scoped라 바인딩/vars/routes 재선언 필요. 리소스는 dev와 동일 원격 리소스 공유
# (로컬 dev는 --local이라 원격 미영향). 시크릿은 --env production으로 별도 설정 필요.
# ─────────────────────────────────────────────────────────────
[env.production]
routes = [
  { pattern = "ata.minu.best", custom_domain = true },
]

[env.production.vars]
ENV = "production"

# 프로덕션 정적 자산 (env-scoped라 재선언)
[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "ga-settle-db"
database_id = "6f2e9c25-466e-42ee-b810-2587fd3101eb"

[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "ga-settle-uploads"

[[env.production.queues.producers]]
binding = "PARSE_QUEUE"
queue = "ga-settle-parse"

[[env.production.queues.consumers]]
queue = "ga-settle-parse"
max_retries = 3
