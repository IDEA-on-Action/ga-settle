name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json packageManager(pnpm@9.15.0)에서 읽음
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # B-016: E2E 게이트(2026-07-17 e2e-audit). E2E가 CI 미포함이라 F-035~F-042 UI 진화(텍스트→선택기)를
      # spec이 못 따라가 전부 stale 실패한 걸 오래 미감지했다. mock 기반이라 빠르고 결정적. webServer(vite)는
      # playwright가 자동 기동. deploy는 needs:verify라 E2E 실패 시 자동으로 배포도 차단된다.
      - name: Playwright 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm -F web exec playwright install --with-deps chromium
      - run: pnpm -F web e2e

  # B-014: main push 시 자동 배포. 과거엔 배포가 완전 수동(wrangler deploy)이라
  # F-064 migration + F-065/F-066 코드가 CI green인데 prod 미배포로 방치된 사고가 있었다(2026-07-17).
  # verify 통과 후에만 실행. migration을 배포보다 먼저 적용해 신규 코드가 옛 스키마를 만나지 않게 한다.
  # 필요 secret: CLOUDFLARE_API_TOKEN(Workers 배포 + D1 편집 권한), CLOUDFLARE_ACCOUNT_ID.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy
      cancel-in-progress: false # 배포 중첩 방지, 진행 중 배포는 완주
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # 0) secret 가드: 토큰 미설정이면 배포를 깔끔히 건너뛴다(빨간 실패 대신 초록 skip).
      #    Settings > Secrets and variables > Actions 에 CLOUDFLARE_API_TOKEN/ACCOUNT_ID 추가 시 자동 활성.
      - id: guard
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN/ACCOUNT_ID 미설정 - 자동 배포 건너뜀. 수동: pnpm -F api deploy:prod"
          fi
      # 1) D1 migration 먼저 적용 (d1_migrations 테이블에 자동 기록 - drift 방지).
      #    미적용 migration이 없으면 no-op. 스키마가 코드보다 앞서거나 같은 상태를 보장.
      - if: steps.guard.outputs.ready == 'true'
        run: pnpm -F api d1:migrate:remote
      # 2) SPA 빌드 (worker가 ../web/dist 정적 자산 서빙 - 배포 전 필수).
      - if: steps.guard.outputs.ready == 'true'
        run: pnpm -F web build
      # 3) Worker 배포 (프로덕션 환경).
      - if: steps.guard.outputs.ready == 'true'
        run: pnpm -F api deploy:prod
      # 4) 배포 후 헬스 스모크 (실패 시 잡 실패로 표면화).
      - if: steps.guard.outputs.ready == 'true'
        run: |
          sleep 5
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 https://z01.minu.best/health)
          echo "health: $code"
          [ "$code" = "200" ] || { echo "헬스체크 실패"; exit 1; }
